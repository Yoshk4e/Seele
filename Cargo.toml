[package]
name = "seele"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "seele"

[dependencies]
ilhook = "2.3.0"
windows = {
  version = "0.62.2",
  features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading"
  ]
}

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
